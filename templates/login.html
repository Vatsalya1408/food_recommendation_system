<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToddlerBites - Login (Firebase Connected)</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ===================================
           GLOBAL STYLES & RESET
           =================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #a8e6cf 0%, #ffd3b6 50%, #aad4f5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ===================================
           CONTAINER & CARD STYLES
           =================================== */
        .container {
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 40px 35px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            animation: fadeIn 0.6s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===================================
           LOGO & TITLE SECTION
           =================================== */
        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            font-size: 60px;
            margin-bottom: 10px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .app-title {
            font-size: 32px;
            color: #66bb6a;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .app-subtitle {
            font-size: 14px;
            color: #888;
            font-weight: 400;
        }

        /* ===================================
           FORM STYLES
           =================================== */
        .form-container {
            animation: slideIn 0.5s ease-in-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .form-title {
            font-size: 24px;
            color: #333;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 600;
        }

        /* ===================================
           INPUT FIELD STYLES
           =================================== */
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #66bb6a;
            font-size: 16px;
            z-index: 1;
        }

        .input-field {
            width: 100%;
            padding: 15px 15px 15px 50px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #fafafa;
            color: #333;
        }

        .input-field:focus {
            outline: none;
            border-color: #66bb6a;
            background: #fff;
            box-shadow: 0 5px 15px rgba(102, 187, 106, 0.2);
        }

        .input-field::placeholder {
            color: #aaa;
        }

        /* Password Toggle Icon */
        .password-toggle {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            cursor: pointer;
            font-size: 16px;
            transition: color 0.3s ease;
            z-index: 1;
        }

        .password-toggle:hover {
            color: #66bb6a;
        }

        /* ===================================
           BUTTON STYLES
           =================================== */
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #66bb6a 0%, #4caf50 100%);
            color: white;
            box-shadow: 0 5px 15px rgba(102, 187, 106, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(102, 187, 106, 0.4);
        }

        .btn-primary:active {
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* ===================================
           LINK STYLES
           =================================== */
        .forgot-password-container {
            text-align: right;
            margin-bottom: 15px;
        }

        .forgot-password {
            color: #66bb6a;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .forgot-password:hover {
            color: #4caf50;
            text-decoration: underline;
        }

        .signup-container {
            text-align: center;
            margin-top: 20px;
        }

        .signup-container p {
            color: #666;
            font-size: 14px;
        }

        .signup-link {
            color: #66bb6a;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .signup-link:hover {
            color: #4caf50;
            text-decoration: underline;
        }

        /* ===================================
           MESSAGE STYLES (Error & Success)
           =================================== */
        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            border-left: 4px solid #c62828;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .success-message {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            border-left: 4px solid #2e7d32;
            animation: slideDown 0.5s ease-in-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Loading Spinner */
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #66bb6a;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===================================
           MODAL STYLES (Forgot Password)
           =================================== */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            animation: fadeIn 0.3s ease-in-out;
        }

        .modal-content {
            background-color: #fff;
            margin: 10% auto;
            padding: 35px;
            border-radius: 25px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            position: relative;
            animation: slideDown 0.4s ease-in-out;
        }

        .modal-content h2 {
            color: #66bb6a;
            margin-bottom: 15px;
            font-size: 26px;
        }

        .modal-content p {
            color: #666;
            margin-bottom: 25px;
            font-size: 15px;
            line-height: 1.6;
        }

        .close-modal {
            position: absolute;
            right: 20px;
            top: 20px;
            font-size: 28px;
            font-weight: 700;
            color: #aaa;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .close-modal:hover {
            color: #666;
        }

        /* ===================================
           RESPONSIVE DESIGN
           =================================== */

        /* Tablet Styles (768px and below) */
        @media (max-width: 768px) {
            .login-card {
                padding: 35px 30px;
                border-radius: 25px;
            }

            .app-title {
                font-size: 28px;
            }

            .form-title {
                font-size: 22px;
            }

            .logo-icon {
                font-size: 50px;
            }
        }

        /* Mobile Styles (480px and below) */
        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .login-card {
                padding: 30px 25px;
                border-radius: 20px;
            }

            .app-title {
                font-size: 26px;
            }

            .app-subtitle {
                font-size: 13px;
            }

            .form-title {
                font-size: 20px;
                margin-bottom: 20px;
            }

            .logo-icon {
                font-size: 45px;
            }

            .input-field {
                padding: 13px 13px 13px 45px;
                font-size: 14px;
            }

            .input-icon {
                left: 15px;
                font-size: 15px;
            }

            .password-toggle {
                right: 15px;
                font-size: 15px;
            }

            .btn {
                padding: 13px;
                font-size: 15px;
            }

            .modal-content {
                padding: 30px 25px;
                margin: 15% auto;
            }

            .modal-content h2 {
                font-size: 22px;
            }

            .modal-content p {
                font-size: 14px;
            }
        }

        /* Small Mobile (360px and below) */
        @media (max-width: 360px) {
            .login-card {
                padding: 25px 20px;
            }

            .app-title {
                font-size: 24px;
            }

            .logo-icon {
                font-size: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Card -->
        <div class="login-card">
            <!-- Logo/Title Section -->
            <div class="logo-section">
                <div class="logo-icon">🍎</div>
                <h1 class="app-title">ToddlerBites</h1>
                <p class="app-subtitle">Healthy Food Recommendations</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="form-container">
                <h2 class="form-title">Welcome Back!</h2>
                
                <!-- Error Message Container -->
                <div id="errorMessage" class="error-message" style="display: none;"></div>
                
                <!-- Success Message Container -->
                <div id="successMessage" class="success-message" style="display: none;"></div>

                <!-- Email Input -->
                <div class="input-group">
                    <i class="fas fa-envelope input-icon"></i>
                    <input 
                        type="email" 
                        id="loginEmail" 
                        class="input-field" 
                        placeholder="Email Address"
                        required
                    >
                </div>

                <!-- Password Input -->
                <div class="input-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input 
                        type="password" 
                        id="loginPassword" 
                        class="input-field" 
                        placeholder="Password"
                        required
                    >
                    <i class="fas fa-eye password-toggle" id="togglePassword"></i>
                </div>

                <!-- Forgot Password Link -->
                <div class="forgot-password-container">
                    <a href="#" id="forgotPasswordLink" class="forgot-password">Forgot Password?</a>
                </div>

                <!-- Login Button -->
                <button type="submit" class="btn btn-primary" id="loginBtn">
                    <span>Login</span>
                    <i class="fas fa-arrow-right"></i>
                </button>

                <!-- Sign Up Link -->
                <div class="signup-container">
                    <p>Don't have an account? <a href="#" id="signupLink" class="signup-link">Sign Up</a></p>
                </div>
            </form>

            <!-- Sign Up Form (Initially Hidden) -->
            <form id="signupForm" class="form-container" style="display: none;">
                <h2 class="form-title">Create Account</h2>
                
                <!-- Error Message Container -->
                <div id="signupErrorMessage" class="error-message" style="display: none;"></div>
                
                <!-- Success Message Container -->
                <div id="signupSuccessMessage" class="success-message" style="display: none;"></div>

                <!-- Full Name Input -->
                <div class="input-group">
                    <i class="fas fa-user input-icon"></i>
                    <input 
                        type="text" 
                        id="fullName" 
                        class="input-field" 
                        placeholder="Full Name"
                        required
                    >
                </div>

                <!-- Email Input -->
                <div class="input-group">
                    <i class="fas fa-envelope input-icon"></i>
                    <input 
                        type="email" 
                        id="signupEmail" 
                        class="input-field" 
                        placeholder="Email Address"
                        required
                    >
                </div>

                <!-- Password Input -->
                <div class="input-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input 
                        type="password" 
                        id="signupPassword" 
                        class="input-field" 
                        placeholder="Password (min. 6 characters)"
                        required
                    >
                    <i class="fas fa-eye password-toggle" id="toggleSignupPassword"></i>
                </div>

                <!-- Confirm Password Input -->
                <div class="input-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        class="input-field" 
                        placeholder="Confirm Password"
                        required
                    >
                </div>

                <!-- Sign Up Button -->
                <button type="submit" class="btn btn-primary" id="signupBtn">
                    <span>Sign Up</span>
                    <i class="fas fa-user-plus"></i>
                </button>

                <!-- Back to Login Link -->
                <div class="signup-container">
                    <p>Already have an account? <a href="#" id="loginLink" class="signup-link">Login</a></p>
                </div>
            </form>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div id="forgotPasswordModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>Reset Password</h2>
            <p>Enter your email address and we'll send you a link to reset your password.</p>
            <div class="input-group">
                <i class="fas fa-envelope input-icon"></i>
                <input 
                    type="email" 
                    id="resetEmail" 
                    class="input-field" 
                    placeholder="Email Address"
                    required
                >
            </div>
            <button id="sendResetLink" class="btn btn-primary">
                <span>Send Reset Link</span>
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        // Import Firebase modules
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, updateProfile } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

        // ===================================
        // FIREBASE CONFIGURATION
        // REPLACE WITH YOUR FIREBASE CONFIG
        // ===================================
        const firebaseConfig = {
            apiKey: "AIzaSyDZdP-QJUc4OdCwvzX7XbKiHrR5Ram4kJw",
            authDomain: "toddlerbites-eef12.firebaseapp.com",
            projectId: "toddlerbites-eef12",
            storageBucket: "toddlerbites-eef12.appspot.com",
            messagingSenderId: "540132922360",
            appId: "1:540132922360:web:6e1c295ad7778a532cfc0d",
            measurementId: "G-RHM7VW8RLC"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // ===================================
        // GET DOM ELEMENTS
        // ===================================
        
        // Forms
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');
        
        // Login Form Elements
        const loginEmailInput = document.getElementById('loginEmail');
        const loginPasswordInput = document.getElementById('loginPassword');
        const togglePassword = document.getElementById('togglePassword');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const loginBtn = document.getElementById('loginBtn');
        
        // Sign Up Form Elements
        const fullNameInput = document.getElementById('fullName');
        const signupEmailInput = document.getElementById('signupEmail');
        const signupPasswordInput = document.getElementById('signupPassword');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const toggleSignupPassword = document.getElementById('toggleSignupPassword');
        const signupErrorMessage = document.getElementById('signupErrorMessage');
        const signupSuccessMessage = document.getElementById('signupSuccessMessage');
        const signupBtn = document.getElementById('signupBtn');
        
        // Links
        const signupLink = document.getElementById('signupLink');
        const loginLink = document.getElementById('loginLink');
        const forgotPasswordLink = document.getElementById('forgotPasswordLink');
        
        // Modal
        const forgotPasswordModal = document.getElementById('forgotPasswordModal');
        const closeModal = document.querySelector('.close-modal');
        const sendResetLink = document.getElementById('sendResetLink');
        const resetEmailInput = document.getElementById('resetEmail');
        
        
        // ===================================
        // PASSWORD VISIBILITY TOGGLE
        // ===================================
        
        togglePassword.addEventListener('click', function() {
            const type = loginPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            loginPasswordInput.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });
        
        toggleSignupPassword.addEventListener('click', function() {
            const type = signupPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            signupPasswordInput.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });
        
        
        // ===================================
        // FORM SWITCHING (Login ⇄ Sign Up)
        // ===================================
        
        signupLink.addEventListener('click', function(e) {
            e.preventDefault();
            loginForm.style.display = 'none';
            signupForm.style.display = 'block';
            clearMessages();
        });
        
        loginLink.addEventListener('click', function(e) {
            e.preventDefault();
            signupForm.style.display = 'none';
            loginForm.style.display = 'block';
            clearMessages();
        });
        
        
        // ===================================
        // LOGIN WITH FIREBASE
        // ===================================
        
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            clearMessages();
            
            const email = loginEmailInput.value.trim();
            const password = loginPasswordInput.value.trim();
            
            // Basic validation
            if (!email || !password) {
                showError(errorMessage, 'Please fill in all fields.');
                return;
            }
            
            // Disable button and show loading
            setButtonLoading(loginBtn, true);
            
            try {
                // Sign in with Firebase
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                // Save user data to localStorage
                const userData = {
                    name: user.displayName || user.email.split('@')[0],
                    email: user.email
                };
                localStorage.setItem('loggedInUser', JSON.stringify(userData));
                
                showSuccess(successMessage, `Welcome back, ${userData.name}!`);
                
                // Redirect to dashboard (main app) after 2 seconds
                setTimeout(() => {
                    window.location.href = '/dashboard';
                }, 2000);
                
            } catch (error) {
                console.error('Login error:', error);
                let errorMsg = 'Login failed. Please try again.';
                
                // Handle specific Firebase errors
                if (error.code === 'auth/user-not-found') {
                    errorMsg = 'No account found with this email.';
                } else if (error.code === 'auth/wrong-password') {
                    errorMsg = 'Incorrect password.';
                } else if (error.code === 'auth/invalid-email') {
                    errorMsg = 'Invalid email address.';
                } else if (error.code === 'auth/too-many-requests') {
                    errorMsg = 'Too many failed attempts. Please try again later.';
                }
                
                showError(errorMessage, errorMsg);
                setButtonLoading(loginBtn, false);
            }
        });
        
        
        // ===================================
        // SIGN UP WITH FIREBASE
        // ===================================
        
        signupForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            clearMessages();
            
            const fullName = fullNameInput.value.trim();
            const email = signupEmailInput.value.trim();
            const password = signupPasswordInput.value.trim();
            const confirmPassword = confirmPasswordInput.value.trim();
            
            // Validation
            if (!fullName || fullName.length < 3) {
                showError(signupErrorMessage, 'Please enter a valid name (min. 3 characters).');
                return;
            }
            
            if (!email) {
                showError(signupErrorMessage, 'Please enter your email address.');
                return;
            }
            
            if (password.length < 6) {
                showError(signupErrorMessage, 'Password must be at least 6 characters long.');
                return;
            }
            
            if (password !== confirmPassword) {
                showError(signupErrorMessage, 'Passwords do not match.');
                return;
            }
            
            // Disable button and show loading
            setButtonLoading(signupBtn, true);
            
            try {
                // Create user with Firebase
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                // Update user profile with display name
                await updateProfile(user, {
                    displayName: fullName
                });
                
                showSuccess(signupSuccessMessage, 'Account created successfully!');
                
                // Switch to login form after 2 seconds
                setTimeout(() => {
                    signupForm.reset();
                    signupForm.style.display = 'none';
                    loginForm.style.display = 'block';
                    clearMessages();
                    showSuccess(successMessage, 'Account created! Please log in.');
                }, 2000);
                
            } catch (error) {
                console.error('Signup error:', error);
                let errorMsg = 'Signup failed. Please try again.';
                
                // Handle specific Firebase errors
                if (error.code === 'auth/email-already-in-use') {
                    errorMsg = 'This email is already registered. Please log in.';
                } else if (error.code === 'auth/invalid-email') {
                    errorMsg = 'Invalid email address.';
                } else if (error.code === 'auth/weak-password') {
                    errorMsg = 'Password is too weak. Use at least 6 characters.';
                }
                
                showError(signupErrorMessage, errorMsg);
                setButtonLoading(signupBtn, false);
            }
        });
        
        
        // ===================================
        // FORGOT PASSWORD WITH FIREBASE
        // ===================================
        
        forgotPasswordLink.addEventListener('click', function(e) {
            e.preventDefault();
            forgotPasswordModal.style.display = 'block';
        });
        
        closeModal.addEventListener('click', function() {
            forgotPasswordModal.style.display = 'none';
            resetEmailInput.value = '';
        });
        
        window.addEventListener('click', function(e) {
            if (e.target === forgotPasswordModal) {
                forgotPasswordModal.style.display = 'none';
                resetEmailInput.value = '';
            }
        });
        
        sendResetLink.addEventListener('click', async function() {
            const email = resetEmailInput.value.trim();
            
            if (!email) {
                alert('Please enter your email address.');
                return;
            }
            
            setButtonLoading(sendResetLink, true);
            
            try {
                await sendPasswordResetEmail(auth, email);
                alert(`Password reset email sent to ${email}. Please check your inbox.`);
                forgotPasswordModal.style.display = 'none';
                resetEmailInput.value = '';
            } catch (error) {
                console.error('Reset error:', error);
                let errorMsg = 'Failed to send reset email.';
                
                if (error.code === 'auth/user-not-found') {
                    errorMsg = 'No account found with this email.';
                } else if (error.code === 'auth/invalid-email') {
                    errorMsg = 'Invalid email address.';
                }
                
                alert(errorMsg);
            } finally {
                setButtonLoading(sendResetLink, false);
            }
        });
        
        
        // ===================================
        // UTILITY FUNCTIONS
        // ===================================
        
        function showError(element, message) {
            element.textContent = message;
            element.style.display = 'block';
        }
        
        function showSuccess(element, message) {
            element.textContent = message;
            element.style.display = 'block';
        }
        
        function clearMessages() {
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            signupErrorMessage.style.display = 'none';
            signupSuccessMessage.style.display = 'none';
        }
        
        function setButtonLoading(button, isLoading) {
            if (isLoading) {
                button.disabled = true;
                button.innerHTML = '<div class="spinner"></div> <span>Loading...</span>';
            } else {
                button.disabled = false;
                // Restore original button content based on button ID
                if (button.id === 'loginBtn') {
                    button.innerHTML = '<span>Login</span><i class="fas fa-arrow-right"></i>';
                } else if (button.id === 'signupBtn') {
                    button.innerHTML = '<span>Sign Up</span><i class="fas fa-user-plus"></i>';
                } else {
                    button.innerHTML = '<span>Send Reset Link</span><i class="fas fa-paper-plane"></i>';
                }
            }
        }
    </script>
</body>
</html>
